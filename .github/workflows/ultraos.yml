name: Build UltraOS

on:
  push:
    branches: [ info ]
    paths:
      - 'os/Makefile'
      - 'os/grub/**'
      - 'os/kernel/**'
  pull_request:
    branches: [ info ]
    paths:
      - 'os/Makefile'
      - 'os/grub/**'
      - 'os/kernel/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Check if os folder changed
      id: check
      run: |
        CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^os/' || true)
        if [ -z "$CHANGED" ]; then
          echo "No changes in os/ folder, skipping build."
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "Changes detected in os/, continuing build."
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    - name: Stop if nothing changed
      if: steps.check.outputs.skip == 'true'
      run: exit 0

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential nasm grub-pc-bin xorriso mtools

    - name: Build ISO
      working-directory: os
      run: make

    - name: Delete old release (if exists)
      run: |
        gh release delete ultraos-latest --yes || true
        git push origin :refs/tags/ultraos-latest || true
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}

    - name: Create new tag
      run: |
        git tag -f ultraos-latest
        git push --force origin ultraos-latest

    - name: Create release with ISO
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ultraos-latest
        name: OS Build (Latest)
        body: |
          This is the latest build of the `os` folder.
        files: os/ultraos.iso
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
